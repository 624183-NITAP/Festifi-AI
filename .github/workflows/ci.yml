name: FestiFi AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static Analysis (ESLint)
        run: npm run lint

      - name: TypeScript Strict Type Check
        run: npm run typecheck

      - name: Automated Unit & Integration Tests (Vitest)
        run: npm test

      - name: Production Bundle Build (Next.js)
        run: npm run build
        env:
          NODE_ENV: production
